name: Lint

# ruff with the rules in pyproject.toml: pyflakes (unused names, undefined names) and syntax errors. No formatter, no style rules.

on:
  pull_request:
  push:
    branches: [b70]

permissions:
  contents: read

jobs:
  ruff:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install ruff
        run: |
          python3 -m venv "$RUNNER_TEMP/ruff"
          "$RUNNER_TEMP/ruff/bin/pip" install ruff==0.16.9
      - name: ruff check
        run: '"$RUNNER_TEMP/ruff/bin/ruff" check .'
