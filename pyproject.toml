# Lint only. This repository is not a Python package: no [project] or [build-system] table on purpose.
# Only real defects are checked (pyflakes F, syntax/runtime E9). No formatter, no import sorting, no style rules.
[tool.ruff]
target-version = "py310"
extend-exclude = ["third_party"]

[tool.ruff.lint]
select = ["F", "E9"]
